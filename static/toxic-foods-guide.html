  <!-- Google Fonts: Press Start 2P & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #111;
      --text-color: #eee;
      --accent-color: #0ff;
      --card-bg: #222;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans JP', sans-serif;
      line-height: 1.6;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px 0;
      border-bottom: 4px dashed var(--accent-color);
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 24px;
      color: var(--accent-color);
      text-shadow: 0 0 10px var(--accent-color);
      margin-bottom: 15px;
      line-height: 1.5;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .food-card {
      background: var(--card-bg);
      border: 2px solid #444;
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s, border-color 0.2s;
    }

    .food-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
    }

    .sprite-container {
      width: 64px;
      height: 64px;
      margin-bottom: 15px;
      background: #000;
      border: 2px solid #555;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .food-name {
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #ff5555;
      margin-bottom: 15px;
      text-align: center;
      line-height: 1.4;
    }

    .food-desc {
      font-size: 14px;
      color: #ccc;
    }

    .target-tags {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      width: 100%;
      justify-content: center;
    }

    .tag {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      color: #fff;
    }
    .tag.dog { background: #f5c518; color: #000; }
    .tag.cat { background: #88cc44; color: #000; }
    .tag.rabbit { background: #ff4488; }
    .tag.all { background: #ff4444; }

    .back-btn {
      display: inline-block;
      margin-top: 40px;
      padding: 15px 30px;
      background: rgba(0, 255, 255, 0.1);
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      text-decoration: none;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      border-radius: 8px;
      transition: all 0.3s;
      text-align: center;
    }

    .back-btn:hover {
      background: var(--accent-color);
      color: #000;
      box-shadow: 0 0 20px var(--accent-color);
    }

    .center {
      text-align: center;
    }
  </style>
</head>

  </header>

    // 3. Render logic
    const container = document.getElementById('dictionary');

    function drawPixelArt(canvas, grid) {
      const ctx = canvas.getContext('2d');
      const px = 6; // pixel size for display
      const w = grid[0].length * px;
      const h = grid.length * px;
      
      canvas.width = w;
      canvas.height = h;

      grid.forEach((row, y) => {
        row.forEach((col, x) => {
          if (col !== '.') {
            ctx.fillStyle = col;
            ctx.fillRect(x * px, y * px, px, px);
          }
        });
      });
    }

    foods.forEach((food, index) => {
      // Create card
      const card = document.createElement('div');
      card.className = 'food-card';

      // Sprite container
      const spriteContainer = document.createElement('div');
      spriteContainer.className = 'sprite-container';
      const canvas = document.createElement('canvas');
      spriteContainer.appendChild(canvas);
      drawPixelArt(canvas, food.grid);

      // Name
      const nameEl = document.createElement('h3');
      nameEl.className = 'food-name';
      nameEl.textContent = food.name;

      // Tags
      const tagsEl = document.createElement('div');
      tagsEl.className = 'target-tags';
      food.tags.forEach(t => {
        const span = document.createElement('span');
        span.className = `tag ${t.class}`;
        span.textContent = t.label;
        tagsEl.appendChild(span);
      });

      // Description
      const descEl = document.createElement('p');
      descEl.className = 'food-desc';
      descEl.textContent = food.desc;
      descEl.style.marginTop = '15px';

      // Assemble
      card.appendChild(spriteContainer);
      card.appendChild(nameEl);
      card.appendChild(tagsEl);
      card.appendChild(descEl);

      container.appendChild(card);
